<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<script>if(location.protocol==="http:"&&/(^|\.)plair\.pro$/.test(location.hostname))location.replace("https:"+location.href.slice(5));</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0E0C">
<title>PLAIR Games — small web games by their makers</title>
<meta name="description" content="Publish a web game from your own GitHub repository and play anything here without an account.">
<link rel="canonical" href="https://plair.pro/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://plair.pro/">
<meta property="og:title" content="PLAIR Games — small web games by their makers">
<meta property="og:description" content="Swipe through small web games and play them right here, no account needed. Publish yours from your own GitHub repository.">
<link rel="icon" href="/assets/favicon-games.svg?v=1" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800&display=swap">
<link rel="stylesheet" href="/styles.css?v=41">
<link rel="stylesheet" href="/games/games.css?v=53">
</head>
<body>
<a class="skip-link" href="#feed">Skip to the games</a>

<header class="g-top">
  <div class="g-shell g-top-in">
    <a class="g-brand" href="/" aria-label="PLAIR Games"><span class="logo"></span></a>
    <div class="g-qslot">
      <form class="g-search" id="search" role="search" action="#" autocomplete="off">
        <svg class="g-q-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg>
        <input id="q" type="search" spellcheck="false"
          autocapitalize="none" enterkeyhint="search" aria-label="Search games">
        <button class="g-q-x" id="q-x" type="button" aria-label="Clear the search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg></button>
      </form>
    </div>
    <div class="g-acts">
      <button class="g-round g-q-open" id="q-open" type="button" aria-label="Search" aria-controls="search" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg></button>
      <button class="g-round" id="how" type="button" aria-label="How to add a game">i</button>
      <button class="g-who" id="who" type="button" aria-label="Account"></button>
      <button class="g-round g-add" id="submit-open" type="button" aria-label="Submit a game" title="Submit a game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</header>

<nav class="g-filters" id="filters" aria-label="Filter by genre"></nav>

<main class="g-deck" id="feed" tabindex="-1" aria-label="Games">
  <p class="g-hint" style="margin:40vh auto;text-align:center">Loading the catalogue&hellip;</p>
</main>

<dialog id="contact-dialog" class="contact-dialog" aria-labelledby="contact-title" aria-describedby="form-status">
  <div class="contact-inner">
    <div class="contact-top"><span>PLAIR / CONTACT</span><button type="button" class="close-button" id="contact-close" aria-label="Close the form"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 16 16M20 4 4 20"/></svg></button></div>
    <h2 id="contact-title">Let&rsquo;s<br>talk<br>games.</h2>
    <form id="contact-form">
      <div class="form-fields">
        <label class="field"><span>Your name</span><input type="text" name="name" autocomplete="name" required maxlength="120"></label>
        <label class="field"><span>Email or Telegram</span><input type="text" name="contact" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="180" aria-describedby="contact-error"><small id="contact-error" class="field-error" hidden>Enter an email or a Telegram @username.</small></label>
        <label class="field"><span>Subject</span><input type="text" name="subject" maxlength="140" autocomplete="off"></label>
        <label class="field project-field"><span>Message</span><textarea name="message" rows="3" required maxlength="5000"></textarea></label>
        <div class="honeypot" aria-hidden="true"><label>Website<input name="_gotcha" type="text" tabindex="-1" autocomplete="off"></label></div>
      </div>
      <div class="sending" id="form-sending" aria-hidden="true">
        <div class="cube-scene">
          <div class="cube-lift"><div class="cube"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
          <div class="cube-glow"></div>
          <div class="cube-plinth"></div>
        </div>
        <p class="sending-text">Sending your message&hellip;</p>
      </div>
      <div class="form-bottom">
        <div class="walker" aria-hidden="true"></div>
        <p class="form-status" id="form-status" role="status"></p>
        <button class="button solid" id="contact-submit" type="submit">
          <span class="blob" aria-hidden="true"></span><span class="f1">Send</span>
          <span class="f2" aria-hidden="true">Send<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </form>
  </div>
</dialog>

<script src="/content.js?v=52" defer></script>
<script src="/games/games.js?v=70" defer></script>
</body></html>
