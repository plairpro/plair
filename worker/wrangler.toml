name = "plair-counts"
main = "src/worker.js"
compatibility_date = "2026-10-12"

# Базу создаёт ./setup.sh и сам подставляет сюда её id.
[[d1_databases]]
binding = "DB"
database_name = "plair-counts"
database_id = "8bbd0b76-6206-45af-8c5b-e2024766ee8c"

# Куда слать уведомления о новых комментариях. Сам ключ бота — секрет,
# его кладёт ./setup.sh (wrangler secret put TG_BOT_TOKEN), в файлах его нет.
[vars]
TG_CHAT_ID = "876305"
